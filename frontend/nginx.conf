# Frontend konteynerindeki nginx: derlenmiş React dosyalarını sunar, /api isteklerini backend'e aktarır
# (geliştirmedeki Vite proxy'nin yayındaki karşılığı: /api/videos -> backend:8080/videos).
# Paylaşım botları (link önizlemesi için sayfayı okuyan programlar). JavaScript çalıştırmadıkları için React sayfası
# onlara boş görünür; bunlar /watch/5 isteyince backend'in hazırladığı başlık + kapak resimli küçük sayfa gönderilir.
map $http_user_agent $paylasim_botu {
    default 0;
    ~*(facebookexternalhit|facebot|twitterbot|whatsapp|telegrambot|slackbot|discordbot|linkedinbot|skypeuripreview|pinterest|redditbot|applebot|googlebot|bingbot|embedly|vkshare|iframely) 1;
}

upstream backend_api {
    server backend:8080;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dosyalar doğrudan MinIO'ya yükleniyor; buradan büyük gövde geçmez
    client_max_body_size 2m;

    location /api/ {
        # Sondaki "/" baştaki /api'yi siler
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        # Gerçek ziyaretçi adresi: backend bununla sayar (görüntülenme, hız sınırı). Yalnız iç ağdaki bu proxy'ye güvenilir
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Derleme çıktısındaki dosya adları içerik özetli (index-3f2a.js): sonsuza kadar önbelleğe alınabilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # İzleme sayfası: bot ise önizleme sayfası (backend /og/watch/5), insan ise React uygulaması
    location ~ ^/watch/([0-9]+)$ {
        # Host: asıl adres gider; yoksa "backend_api" gider ve Tomcat alt çizgili adı geçersiz sayıp 400 döner.
        # (nginx bu satırı "if" içinde kabul etmiyor; burada yalnız istek backend'e aktarılınca kullanılır)
        proxy_set_header Host $host;
        if ($paylasim_botu) {
            rewrite ^/watch/([0-9]+)$ /og/watch/$1 break;
            proxy_pass http://backend_api;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Tek sayfa uygulama: /watch/5 gibi adresler sunucuda dosya değil, hepsi index.html'e gider, yönlendirmeyi React yapar
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
