spring.application.name=watchit

# Yerel makineye özel ayarlar (şifreler vb.) application-local.properties dosyasından okunur.
# Bu dosya .gitignore'da olduğu için repoya gitmez, her makinede ayrı oluşturulur.
spring.config.import=optional:application-local.properties

# ===============================
# 1. POSTGRES VERİTABANI AYARLARI
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/watchit
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Boot'a "Tahmin etme, veritabanımız kesinlikle Postgres" diyoruz
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Tabloları artık Hibernate değil Flyway yönetiyor (db/migration altındaki V1, V2... dosyaları).
# validate: Hibernate tabloya dokunmaz, sadece entity ile tablo uyuşuyor mu diye bakar; uyuşmuyorsa uygulama açılmaz.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
# Flyway'den önce kurulmuş, içinde tablo olan veritabanı için: V1'i çalıştırma, "zaten V1 hâlinde" diye işaretle.
# Boş veritabanında bu ayar devreye girmez, V1 normal şekilde çalışır.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# 2. MINIO BULUT DEPOLAMA AYARLARI
# ===============================
minio.url=http://localhost:9000
minio.access.key=admin
minio.secret.key=${MINIO_SECRET_KEY}
minio.bucket.name=watchit-images

# ===============================
# 3. HATA CEVABI AYARLARI
# ===============================
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never