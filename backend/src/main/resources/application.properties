spring.application.name=watchit

# Yerel makineye özel ayarlar (şifreler vb.) application-local.properties dosyasından okunur.
# Bu dosya .gitignore'da olduğu için repoya gitmez, her makinede ayrı oluşturulur.
spring.config.import=optional:application-local.properties

# ===============================
# 1. POSTGRES VERİTABANI AYARLARI
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/watchit
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Boot'a "Tahmin etme, veritabanımız kesinlikle Postgres" diyoruz
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Tabloları artık Hibernate değil Flyway yönetiyor (db/migration altındaki V1, V2... dosyaları).
# validate: Hibernate tabloya dokunmaz, sadece entity ile tablo uyuşuyor mu diye bakar; uyuşmuyorsa uygulama açılmaz.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
# Flyway'den önce kurulmuş, içinde tablo olan veritabanı için: V1'i çalıştırma, "zaten V1 hâlinde" diye işaretle.
# Boş veritabanında bu ayar devreye girmez, V1 normal şekilde çalışır.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# 2. MINIO BULUT DEPOLAMA AYARLARI
# ===============================
minio.url=http://localhost:9000
minio.access.key=admin
minio.secret.key=${MINIO_SECRET_KEY}
minio.bucket.name=watchit-images

# ===============================
# 3. HATA CEVABI AYARLARI
# ===============================
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# ===============================
# 4. JWT AYARLARI
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# ===============================
# 5. YAPAY ZEKÂ (GEMINI + PGVECTOR)
# ===============================
# Anahtarın değeri application-local.properties'te (GEMINI_API_KEY=...), repoya girmez.
# Anahtar yoksa uygulama yine açılır; yalnız yapay zekâ çağrıları hata verir.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:anahtar-yok}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:anahtar-yok}
# Metni 768 sayıya çeviren model (varsayılan 3072; pgvector'ın hızlı indeksi en fazla 2000 boyut alır)
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768
# Kaydedilen parçalar "belge" olarak vektöre çevrilir; sorular (2d) RETRIEVAL_QUERY ile çevrilecek
spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT
# Cevabı ve özeti yazan dil modeli. 27 Kasım: gemini-3-flash-preview (kullanıcı flash-lite'ın cevaplarını zayıf buldu;
# artık genel bilgi sorularına da cevap veriyor). Kotası dolarsa qa.fallback-models'daki flash-lite devreye girer.
# (gemini-2.5-flash yeni anahtarlara kapalı; gemini-3.5-flash'ın ücretsiz sınırı günde yalnız 20 istek; flash-latest'in kotası dolu.)
# Düşük sıcaklık: videoya sadakat, genel cevapta da tutarlılık. thinking-budget=0: hızlı cevap.
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview
spring.ai.google.genai.chat.options.temperature=0.3
spring.ai.google.genai.chat.options.thinking-budget=0
spring.ai.google.genai.chat.options.max-output-tokens=700
# Gemini hata verirse (kota, yoğunluk) en fazla 1 kez kısa bekleyip tekrar dene; varsayılan 10 deneme, katlanarak uzayan beklemeyle
# kullanıcıyı dakikalarca bekletiyordu. Olmazsa 503 ("şu an cevap verilemiyor").
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=3000ms
# Vektör tablosunu Spring AI değil Flyway kurar (V11), ayarlar oradakiyle aynı olmalı
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=cosine-distance
spring.ai.vectorstore.pgvector.index-type=hnsw

# ===============================
# 6. WHISPER (TRANSKRİPT)
# ===============================
# compose'taki watchit_whisper konteyneri (whisper-servisi/)
whisper.url=http://localhost:9010
# 10 dakikalık video işlemcide birkaç dakika sürer; 60 dakikalık videoya da yetsin diye geniş
whisper.timeout-minutes=60
# Video dönüştürme (aynı servis, POST /transcode): uzun videoyu işlemcide yeniden kodlamak uzun sürebilir
video-processing.timeout-minutes=120
# Çoklu kalite (HLS, POST /hls): açılışta yarım kalanlar ve HLS'si olmayan eski videolar sıraya girer (testlerde kapalı)
hls.run-on-startup=${HLS_RUN_ON_STARTUP:true}

# ===============================
# 7. VİDEOYA SORU SOR
# ===============================
# Benzerliği bunun altındaki parçalar kullanılmaz (deneme: alakalı sorular 0.66-0.75, alakasız 0.46 aldı)
qa.min-score=0.55
# Gemini'ye en fazla bu kadar parça verilir
qa.max-chunks=4
# Gemini bu sürede cevap vermezse 503 (yoğunlukta bir dakikayı aşabiliyor)
qa.timeout-seconds=30
# Tek deneme: kota dolunca Gemini kütüphanesi isteği sessizce bekletip tekrar deniyor (asılı kalmış gibi görünür);
# 6 sn'de gelmezse (başarılı cevaplar 27 Kasım ölçümünde hep 2,7 sn altında) iptal edilip sıradaki modelle (qa.fallback-models) yeniden gönderilir
qa.attempt-timeout-seconds=6
# Asıl model takılırsa ya da kotası doluysa sonraki denemelerde sırayla bunlar kullanılır (25 Kasım: flash-latest kotası dolu, 3-flash-preview sağlam)
qa.fallback-models=gemini-3.1-flash-lite

# --- E-posta (SMTP) ---
# Geliştirmede Mailpit (compose: watchit_mail): mail kimseye gitmez, http://localhost:8025'te görünür.
# Yayında MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD ortam değişkenleriyle gerçek servise (Brevo, Resend...) bağlanır;
# kod aynı kalır. Kısa zaman aşımları: posta sunucusu yanıt vermezse istek uzun süre asılı kalmasın.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:WatchIt <no-reply@watchit.local>}
# Maildeki şifre sıfırlama bağlantısı bu adrese gider (frontend)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Doğrulama kodlarını veritabanına yazmadan önce karıştıran gizli anahtar (pepper). Verilmezse JWT anahtarı kullanılır.
app.token-pepper=${TOKEN_PEPPER:${jwt.secret}}
