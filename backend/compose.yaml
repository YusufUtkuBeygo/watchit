
services:
  # 1. POSTGRES VERİTABANI
  watchit_db:
    image: pgvector/pgvector:0.8.7-pg15-trixie # PostgreSQL 15 + pgvector eklentisi (vektör araması)
    container_name: postgres_veritabani
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Buraya kendi şifreni yazabilirsin
      POSTGRES_DB: watchit
    ports:
      - "5433:5432"
    volumes:
      - postgres_kasa:/var/lib/postgresql/data

  # 2. MINIO BULUT DEPOLAMA (Resimler için)
  watchit_storage:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio_depo
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # API Portu
      - "9001:9001" # Arayüz (Tarayıcı) Portu
    volumes:
      - minio_kasa:/data
    command: server /data --console-address ":9001"
    # Konteynerler arası ad: MinIO alt çizgili sunucu adını (watchit_storage) geçersiz sayıp 400 döndürüyor
    networks:
      default:
        aliases:
          - minio

  # 3. WHISPER (videodaki konuşmayı zaman damgalı yazıya çevirir)
  # Spring video adresini gönderir; servis videoyu MinIO'dan indirip yazıya çevirir.
  # İlk istekte model (~1,5 GB) internetten iner, whisper_modeller kasasında saklanır.
  watchit_whisper:
    build: ../whisper-servisi
    container_name: whisper_servisi
    environment:
      WHISPER_MODEL: large-v3-turbo
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      # Veritabanındaki adresler tarayıcıya göre (localhost); konteynerin içinden MinIO'ya servis adıyla gidilir
      PUBLIC_FILE_URL: http://localhost:9000
      INTERNAL_FILE_URL: http://minio:9000
    ports:
      - "9010:8000"
    volumes:
      - whisper_modeller:/modeller
    depends_on:
      - watchit_storage

  # 4. MAILPIT (yalnız geliştirme için sahte e-posta sunucusu)
  # Spring maili SMTP ile buraya gönderir; mail kimseye iletilmez, http://localhost:8025'te görünür.
  # Yayında bunun yerine gerçek bir servis (Brevo/Resend) kullanılır; kod aynı kalır, yalnız bağlantı ayarı değişir.
  watchit_mail:
    image: axllent/mailpit:v1.33.1
    container_name: mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web arayüzü
    restart: unless-stopped

# Verilerin silinmemesi için oluşturduğumuz kalıcı kasalar (Hortumlar)
volumes:
  postgres_kasa:
  minio_kasa:
  whisper_modeller: