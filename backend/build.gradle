plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yutkubeygo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

//Spring AI modüllerinin birbiriyle uyumlu sürümleri (2.0.x, Spring Boot 4.0/4.1 içindir)
dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.3'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	//E-posta gönderme (JavaMailSender, SMTP): doğrulama kodu ve şifre sıfırlama bağlantısı
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	//Sağlık kontrolü ucu (/actuator/health): Docker ve yayın ortamı uygulamanın ayakta olduğunu buradan anlar
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'io.minio:minio:8.6.0'
	//Yapay zekâ: Gemini (embedding + sohbet modeli) ve pgvector (vektör araması)
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	//API dokümanı: /swagger-ui.html (3.1.x Spring Boot 4.1 içindir)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	//Güvenlik taraması (28 Kasım, trivy): başka kütüphanelerin getirdiği alt paketlerde bilinen açıklar; en az bu sürümler kullanılır
	constraints {
		implementation('com.google.guava:guava:33.7.2-jre') {
			because 'CVE-2026-102554 (33.4.0-jre açıklı)'
		}
		//MinIO istemcisinin (8.6.0, en yenisi) getirdiği alt paketler; açıkların kapandığı ilk sürümler
		implementation('org.bouncycastle:bcprov-jdk18on:1.85') {
			because 'CVE-2025-14813, CVE-2026-8763, CVE-2026-13506, CVE-2026-5598 (1.81 açıklı)'
		}
		implementation('org.xerial.snappy:snappy-java:1.1.10.9') {
			because 'CVE-2026-108106, CVE-2026-93451 (1.1.10.7 açıklı)'
		}
	}
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	//testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	//testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'eval'
	}
	//Testler gerçek yerel veritabanına bağlanıyor: açılışta eski videolar HLS sırasına girmesin
	systemProperty 'hls.run-on-startup', 'false'
	systemProperty 'rate-limit.enabled', 'false'
	systemProperty 'chapters.run-on-startup', 'false'
	systemProperty 'storage.orphan-cleanup.enabled', 'false'
}

//Videoya soru sor değerlendirmesi (gerçek Gemini + yerel veritabanı gerekir, CI'da çalışmaz): ./gradlew eval
tasks.register('eval', Test) {
	description = 'Soru-cevap değerlendirmesi: Hit@3, doğruluk, bulunamadı oranı (build/eval/sonuc.md)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'eval'
	}
	systemProperty 'eval.pauseMs', findProperty('eval.pauseMs') ?: '4000'
	systemProperty 'hls.run-on-startup', 'false'
	systemProperty 'rate-limit.enabled', 'false'
	systemProperty 'chapters.run-on-startup', 'false'
	systemProperty 'storage.orphan-cleanup.enabled', 'false'
	testLogging {
		showStandardStreams = true
	}
	outputs.upToDateWhen { false }
}
